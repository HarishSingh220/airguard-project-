name: Rebuild daily AirGuard forecast

on:
  schedule:
    - cron: "0 1 * * *" # 06:30 IST
  workflow_dispatch: {}
  # Run the data repair and forecast rebuild when its inputs change. The path
  # filter excludes the workflow's own generated forecast commits.
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild_forecast.yml"
      - "ingestion/config.py"
      - "ingestion/export_for_modeling.py"
      - "ingestion/fetch_cpcb_recent.py"
      - "ingestion/cpcb_proxy_worker.js"

permissions:
  contents: write

concurrency:
  group: airguard-production-repository-writes
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: python -m pip install -r ingestion/requirements.txt

      - name: Install model runtime dependencies
        run: python ingestion/install_model_runtime.py

      - name: Validate persistent database and historical migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingestion/validate_database.py

      - name: Backfill recent hourly CPCB station history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPCB_PROXY_URL: ${{ secrets.CPCB_PROXY_URL }}
        run: python ingestion/fetch_cpcb_recent.py

      - name: Export current historical and live data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingestion/export_for_modeling.py

      - name: Rebuild fire features
        run: python ingestion/rebuild_fire_daily.py

      - name: Build feature table
        run: python build_features.py

      - name: Validate feature quality
        run: python ingestion/data_quality_check.py

      - name: Check that all production model artifacts are present
        id: model_check
        run: python ingestion/check_model_artifacts.py

      - name: Generate forecast using committed joblib models
        if: steps.model_check.outputs.ready == 'true'
        run: python predict_forecast.py

      - name: Explain why forecast generation was skipped
        if: steps.model_check.outputs.ready != 'true'
        run: |
          echo "## Forecast skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The production model artifact manifest is incomplete. Restore/commit the trained outputs/models files or configure model artifact download before forecast generation." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed features and forecast files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily rebuild: refresh AirGuard features and forecast"
          file_pattern: >-
            era5_surface_hourly_ist.csv
            era5_pressure_levels_6h_ist.csv
            era5_pressure_levels_12h_ist.csv
            cams_3h_ist.csv
            fire_daily_features.csv
            features/**
            outputs/forecast_10d_*.csv
            outputs/final_ensemble_weights_used.json
            outputs/demo_data_marker.json

name: Ingest CPCB (frequent)

# The data.gov.in resource polled by fetch_cpcb.py only returns each station's
# CURRENT reading. The daily forecast workflow uses CPCB's separate report
# export for a rolling recent-history backfill; this frequent workflow still
# captures the live snapshot cadence so the newest values stay current.
# CPCB's feed refreshes every 15-60 minutes, so running this only on the main
# 3-hourly ingest.yml schedule already under-samples it. This workflow polls
# every 15 minutes to reduce that loss window.
#
# Safe to run this independently of (and more often than) ingest.yml's combined
# run: cpcb_hourly is upserted keyed on (station, pollutant, observed_at,
# source) -- CPCB's own reported timestamp for the reading, not our fetch
# time -- so overlapping or redundant polls never create duplicate rows, only
# ever fill in observed_at values the other schedule would have missed.
#
# The rolling report export repairs recent missed readings before the forecast
# rebuild; older snapshot gaps may remain outside that report window.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes, UTC
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

# If a scheduled trigger is ever delayed (GitHub Actions does not guarantee
# exact cron timing, especially under load) and a previous run is still
# retrying CPCB_API_KEY's backoff budget (up to ~5 minutes, see fetch_cpcb.py),
# avoid starting an overlapping run against the same key/proxy.
concurrency:
  group: ingest-cpcb
  cancel-in-progress: false

jobs:
  ingest-cpcb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose api.data.gov.in connectivity
        continue-on-error: true
        run: |
          echo "--- DNS resolution ---"
          getent hosts api.data.gov.in || true
          echo "--- TCP connect timing (10s cap) ---"
          curl -sv --connect-timeout 10 -o /dev/null https://api.data.gov.in/ 2>&1 | \
            grep -E "Trying|Connected|timed out|Failed" || true

      - name: Fetch CPCB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPCB_API_KEY: ${{ secrets.CPCB_API_KEY }}
          CPCB_PROXY_URL: ${{ secrets.CPCB_PROXY_URL }}
        run: python fetch_cpcb.py
